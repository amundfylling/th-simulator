[project]
name = "thsim"
version = "0.1.0"
description = "Monte Carlo table hockey tournament simulator"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scipy>=1.12",
    "numba>=0.60",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["thsim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
